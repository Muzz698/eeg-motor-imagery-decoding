[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegdecode"
version = "0.1.0"
description = "Motor imagery EEG decoding: CSP+LDA vs EEGNet, within- and cross-subject"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Muzamil" }]
dependencies = [
    "mne>=1.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "keras>=3.0",
    "torch>=2.1",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
eegdecode = "eegdecode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a small neural network (about 30 seconds)"]
# Harmless NumPy 2 notice raised inside Keras's PyTorch backend.
filterwarnings = ["ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
